[versions]
agp = "9.5.1"
kotlin = "2.4.10"
ksp = "2.3.13"
composeBom = "2026.08.00"
activityCompose = "1.12.4"
lifecycle = "2.10.0"
navigation = "2.10.1"
room = "2.8.4"
coreKtx = "1.19.0"
serialization = "1.11.0"
